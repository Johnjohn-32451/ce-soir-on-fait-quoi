<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit a phone screen instead of shrinking to a tiny desktop view -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ce soir, on fait quoi ?</title>
  <!-- Relative paths (no leading slash) so the site works on GitHub Pages -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ce soir, on fait quoi ?</h1>
    <p class="subtitle">Une soirée à Lausanne</p>
  </header>

  <main>
    <!-- Filters: hidden until the places are loaded (app.js shows them) -->
    <form id="filters" hidden>
      <label>
        Mood
        <select id="filter-mood">
          <option value="any">Any mood</option>
          <option value="chill">Chill</option>
          <option value="festive">Festive</option>
          <option value="romantic">Romantic</option>
          <option value="cultural">Cultural</option>
          <option value="outdoor">Outdoor</option>
          <option value="foodie">Foodie</option>
        </select>
      </label>

      <label>
        Budget
        <select id="filter-budget">
          <option value="any">Any budget</option>
          <option value="1">● Cheap or free</option>
          <option value="2">●● Up to medium</option>
          <option value="3">●●● Up to expensive</option>
        </select>
      </label>

      <label>
        Type
        <select id="filter-type">
          <option value="any">Any type</option>
          <option value="bar">Bar</option>
          <option value="restaurant">Restaurant</option>
          <option value="activity">Activity</option>
        </select>
      </label>
    </form>

    <!-- app.js fills these elements -->
    <p id="status" role="status">Loading places…</p>

    <!-- Friendly message when no place matches the filters -->
    <div id="no-match" hidden>
      <p id="no-match-title">Nothing matches these filters 🤷</p>
      <p id="no-match-hint">Try loosening one of them.</p>
      <button type="button" id="reset-filters">Reset filters</button>
      <!-- Only shown when vetoed places are the reason nothing is left -->
      <button type="button" id="restore-vetoed" hidden>Bring back vetoed places</button>
    </div>

    <!-- The big Spin button (hidden when there is nothing to spin on) -->
    <button type="button" id="spin-button" hidden>Spin</button>

    <!-- The box that flickers through names during the animation -->
    <div id="spinner" role="status" hidden></div>

    <!-- The result card is placed here by app.js -->
    <div id="result" hidden></div>

    <!-- Saved places (hidden until the data is loaded) -->
    <details id="favorites" hidden>
      <summary>♥ Favorites (<span id="favorites-count">0</span>)</summary>
      <p id="favorites-empty">No favorites yet. Tap "♡ Save" on a result.</p>
      <ul id="favorites-list"></ul>
      <p id="storage-warning" hidden>
        Heads up: this browser is blocking storage, so favorites will be lost when you close the page.
      </p>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
